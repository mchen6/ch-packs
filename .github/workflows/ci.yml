name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's superseded run; a push to
# main is grouped by its sha, so no main run is ever cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Add '22.16' (and latest 22) when countinghouse's Node floor shim lands
        # (spec section 10); until then the runtime needs 24.15+.
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Validate modules
        run: npm run validate

      - name: Pack
        run: npm run pack

      # No Redis: the runtime serves an unmetered call without one, as local
      # mode will.
      # On Windows the runtime never brings a module online (any sandbox mode):
      # countinghouse issue #40. Our own tests, validation and packing gate on
      # Windows; this marker comes off when #40 is fixed.
      - name: Runtime smoke test
        run: npm run smoke
        continue-on-error: ${{ runner.os == 'Windows' }}
