name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's superseded run; a push to
# main is grouped by its sha, so no main run is ever cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# The family repository has no package and no dependency: CI checks its own
# shape (scripts/test). Each package's CI runs in its own repository; Task 13's
# acceptance workflow, from the sibling repositories' tarballs, comes here.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test
        run: npm test
