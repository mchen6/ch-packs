name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's superseded run; a push to
# main is grouped by its sha, so no main run is ever cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Add '22.16' (and latest 22) when countinghouse's Node floor shim lands
        # (spec section 10); until then the runtime needs 24.15+.
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Validate modules
        run: npm run validate

      - name: Pack
        run: npm run pack

      # Until LM1 (in-process metering) lands the runtime needs Redis to serve a
      # call. Linux runners get one in a container; macOS and Windows runners
      # have none, so there the smoke test expects the call to fail and still
      # proves install, start, the sandbox and the tool listing.
      - name: Redis (Linux only, until LM1)
        if: runner.os == 'Linux'
        run: docker run --rm -d -p 127.0.0.1:6379:6379 --name smoke-redis redis:7-alpine

      - name: Runtime smoke test
        run: npm run smoke
        env:
          SMOKE_REDIS_URL: ${{ runner.os == 'Linux' && 'redis://127.0.0.1:6379' || '' }}
          SMOKE_EXPECT_NO_REDIS: ${{ runner.os != 'Linux' && '1' || '' }}
