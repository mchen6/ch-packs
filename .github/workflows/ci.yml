name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's superseded run; a push to
# main is grouped by its sha, so no main run is ever cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# The family repository has no package and no dependency: CI checks its own
# shape (scripts/test). Each package's CI runs in its own repository; Task 13's
# acceptance workflow, from the sibling repositories' tarballs, comes here.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # (Node 22.16, the floor, beside 24: the maintainer's decision)
        node: ['24', '22.16']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: npm test
