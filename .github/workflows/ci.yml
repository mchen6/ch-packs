name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        sandbox: [enforce, audit, off]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Runtime smoke test
        run: npm run smoke
        env:
          SMOKE_SANDBOX: ${{ matrix.sandbox }}
          SMOKE_SHOW_OUTPUT: '1'
