name: publish

# Publishes the pack family to npm under trusted publishing (OIDC): this
# repository holds no npm token and nobody types a 2FA code. GitHub hands the
# job a short-lived identity token, npm checks it against the trusted publisher
# configured on each package (owner mchen6, repository ch-packs, workflow file
# publish.yml), and attaches provenance to every version. The one-time steps
# per package, which only the maintainer can do, are in docs/publishing.md.
#
# Runs when a version tag is pushed to a commit on main, or by hand (dry run
# lists what would be published and publishes nothing). Every workspace whose
# version is not on the registry yet is published; the rest are skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'list what would be published, publish nothing'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # the OIDC token npm trusts; the only credential involved

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: npm supports trusted publishing (11.5.1 or later)
        run: node scripts/publish-changed.js --check-npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Validate modules
        run: npm run validate

      - name: Publish what is new
        run: node scripts/publish-changed.js ${{ inputs.dry_run && '--dry-run' || '' }}
